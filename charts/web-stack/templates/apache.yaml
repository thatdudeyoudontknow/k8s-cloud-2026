{{- range $component := list "apache-a" "apache-b" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-stack-{{ $component }}-content
  labels:
    {{- include "webstack.labels" $ | nindent 4 }}
data:
  index.html: |
    <!doctype html>
    <html><head><title>{{ $component }}</title></head><body>
    <h1>{{ if eq $component "apache-a" }}Apache A{{ else }}Apache B{{ end }}</h1>
    <p>environment={{ $.Values.environment }}</p>
    <p>component={{ $component }}</p>
    </body></html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-stack-{{ $component }}
  labels:
    {{- include "webstack.labels" $ | nindent 4 }}
spec:
  replicas: {{ $.Values.apache.replicas }}
  selector:
    matchLabels:
      {{- include "webstack.component.labels" $component | nindent 6 }}
  template:
    metadata:
      annotations:
        portfolio.example/environment: {{ $.Values.environment | quote }}
      labels:
        {{- include "webstack.component.labels" $component | nindent 8 }}
    spec:
      containers:
      - name: apache
        image: {{ $.Values.apache.image | quote }}
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            cpu: 25m
            memory: 40Mi
          limits:
            cpu: 300m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 2
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        volumeMounts:
        - name: site
          mountPath: /usr/local/apache2/htdocs/index.html
          subPath: index.html
          readOnly: true
      volumes:
      - name: site
        configMap:
          name: web-stack-{{ $component }}-content
---
apiVersion: v1
kind: Service
metadata:
  name: web-stack-{{ $component }}
  labels:
    {{- include "webstack.labels" $ | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "webstack.component.labels" $component | nindent 4 }}
  ports:
  - name: http
    port: 80
    targetPort: http
{{- end }}
