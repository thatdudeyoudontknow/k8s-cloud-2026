apiVersion: v1
kind: ConfigMap
metadata:
  name: web-stack-nginx-conf
  labels:
    {{- include "webstack.labels" . | nindent 4 }}
data:
  default.conf: |
    upstream apache_pool {
      server web-stack-apache-a:80;
      server web-stack-apache-b:80;
    }
    server {
      listen 80;
      server_name _;
      location = /healthz { access_log off; return 200 "ok\n"; }
      location /a/ { proxy_pass http://web-stack-apache-a/; }
      location /b/ { proxy_pass http://web-stack-apache-b/; }
      location / { proxy_pass http://apache_pool; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-stack-nginx
  labels:
    {{- include "webstack.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.nginx.replicas }}
  selector:
    matchLabels:
      {{- include "webstack.component.labels" "nginx" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "webstack.component.labels" "nginx" | nindent 8 }}
    spec:
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            {{- include "webstack.component.labels" "nginx" | nindent 12 }}
      containers:
      - name: nginx
        image: {{ .Values.nginx.image | quote }}
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 80
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 300m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 2
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        volumeMounts:
        - name: nginx-conf
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
          readOnly: true
      volumes:
      - name: nginx-conf
        configMap:
          name: web-stack-nginx-conf
---
apiVersion: v1
kind: Service
metadata:
  name: web-stack-nginx
  labels:
    {{- include "webstack.labels" . | nindent 4 }}
spec:
  type: NodePort
  selector:
    {{- include "webstack.component.labels" "nginx" | nindent 4 }}
  ports:
  - name: http
    port: 80
    targetPort: http
    nodePort: {{ .Values.nginx.nodePort }}
